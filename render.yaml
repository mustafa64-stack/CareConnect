services:
  - type: web
    name: goldenhour-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: goldenhour-ml
          property: host

  - type: web
    name: goldenhour-ml
    runtime: python
    rootDir: ml-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT server:app
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
